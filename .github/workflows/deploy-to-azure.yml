name: Azure 2.Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      # Terraform reads TF_VAR_<name> natively, so no tfvars file is written to
      # the runner's disk and no secret goes through shell quoting.
      # `azure` only declares repo_pat; the github_* vars live in `local`.
      TF_VAR_repo_pat: ${{ secrets.MOCKTEN_REPO_PAT }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.5

    - name: Initialize Terraform for Azure
      working-directory: azure
      run: terraform init

    - name: Terraform Apply for Azure
      working-directory: azure
      run: terraform apply -auto-approve
      
  local-k8s-deployment:
    needs: deploy
    #runs-on: [self-hosted, mockten-vmss]
    runs-on: self-hosted
    steps:
    - name: Check if runner is working and output to /tmp/runner_status.txt
      run: |
        echo "GitHub Actions Runner is running on $(hostname)" > /tmp/runner_status.txt
        echo "Working Directory: $(pwd)" >> /tmp/runner_status.txt
        echo "Date: $(date)" >> /tmp/runner_status.txt
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.5
