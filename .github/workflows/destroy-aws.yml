name: AWS 3.Destroy

# Tears the whole AWS environment down, to GCP/Azure 3.Destroy parity. Manual only,
# and demands the AWS account id be typed in, so a destroy is never one mis-click
# from an apply. Works from ANY state — including a half-destroyed one — and cleans
# up billing resources Terraform does not track (the ALB, target groups and
# security groups the Load Balancer Controller creates out-of-band, plus orphaned
# EBS volumes), so nothing keeps costing after it runs. The S3 tfstate bucket and
# the DynamoDB lock table are intentionally preserved.
#
# Required repository secrets: the same set Deploy(AWS) uses.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the AWS account id to confirm destruction"
        required: true
        type: string

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      TF_VAR_region: ${{ secrets.AWS_REGION }}
      TF_VAR_github_username: ${{ secrets.GH_USERNAME }}
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
      TF_VAR_github_email: ${{ secrets.GH_EMAIL }}
      TF_VAR_google_client_id: ${{ secrets.CLOUD_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.CLOUD_GOOGLE_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_facebook_client_id: ${{ secrets.CLOUD_FACEBOOK_CLIENT_ID || secrets.FACEBOOK_CLIENT_ID }}
      TF_VAR_facebook_client_secret: ${{ secrets.CLOUD_FACEBOOK_CLIENT_SECRET || secrets.FACEBOOK_CLIENT_SECRET }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_public_key: ${{ secrets.STRIPE_PUBLIC_KEY }}
      TF_VAR_domain_api_key: ${{ secrets.DOMAIN_API_KEY }}
      TF_VAR_allowlist_cidr: ${{ secrets.ALLOWLIST_CIDR }}
      TF_VAR_root_domain: ${{ secrets.ROOT_DOMAIN }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check the typed confirmation
        run: |
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          if [ "${{ inputs.confirm }}" != "${ACCOUNT}" ]; then
            echo "::error::Confirmation does not match the AWS account id. Nothing was destroyed."
            exit 1
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          # No wrapper: the teardown deliberately `|| true`s benign failures (e.g.
          # `terraform state rm` of an address already gone), but the wrapper would
          # still surface each as a red "Terraform exited with code 1" annotation.
          # Real failures still fail the step via its own exit code.
          terraform_wrapper: false
          terraform_version: 1.9.5

      - name: Terraform init
        working-directory: aws
        run: terraform init -backend-config="bucket=${{ secrets.AWS_TFSTATE_BUCKET }}"

      # Make destroy work from ANY state, including a half-destroyed one.
      #   1. Cluster still up  -> authorize this runner LIVE on the EKS API server
      #      (setting the TF var alone is not enough on destroy).
      #   2. Cluster already gone but its k8s objects still sit in state -> those died
      #      with the cluster, so drop them from state; otherwise Terraform tries to
      #      refresh them against an API endpoint that no longer exists and times out.
      # The Kubernetes layer is the fragile part of an EKS destroy, and Terraform
      # deleting it in-graph fails two ways: (1) an ALB Ingress carries an LBC
      # finalizer, and if the controller can't reach the ELB API (egress already
      # gone) it never clears it, so the delete hangs forever; (2) a long destroy
      # outlives the 15-min EKS auth token and every later k8s call returns
      # "Unauthorized". So don't let Terraform manage k8s on teardown at all: force
      # the Ingress finalizers off (the ALB is reclaimed by tag in the final step),
      # then drop every k8s/Helm/kubectl resource from state. They die with the
      # cluster anyway; Terraform is left to destroy only the AWS infrastructure.
      - name: Force-delete ALB Ingresses and drop Kubernetes from state
        working-directory: aws
        run: |
          RUNNER_IP="$(curl -s https://api.ipify.org)/32"
          echo "TF_VAR_master_authorized_extra=[\"${RUNNER_IP}\"]" >> "$GITHUB_ENV"
          CLUSTER="$(aws eks list-clusters --query 'clusters[0]' --output text 2>/dev/null)"
          if [ "${CLUSTER}" != "None" ] && [ -n "${CLUSTER}" ]; then
            NETS="$(echo "${TF_VAR_allowlist_cidr},${RUNNER_IP}" | tr -d '[:space:]')"
            echo "Cluster ${CLUSTER} is up — authorizing this runner to reach the API."
            aws eks update-cluster-config --name "${CLUSTER}" \
              --resources-vpc-config "endpointPublicAccess=true,publicAccessCidrs=${NETS}" || true
            for _ in $(seq 1 30); do
              S="$(aws eks describe-cluster --name "${CLUSTER}" --query 'cluster.status' --output text)"
              [ "${S}" = "ACTIVE" ] && break
              sleep 20
            done
            aws eks update-kubeconfig --name "${CLUSTER}" --region "${TF_VAR_region}" || true
            for ING in ecfront-store ecfront-sales ecfront-admin dashboard; do
              kubectl -n default patch ingress "${ING}" --type=merge \
                -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
              kubectl -n default delete ingress "${ING}" --ignore-not-found --timeout=30s 2>/dev/null || true
            done
          else
            echo "No cluster found."
          fi
          # Delete the LBC ALB now, up front. It holds the frontend SG (Terraform's
          # aws_security_group.alb_frontend) and the LBC's own k8s-traffic SG, so any
          # attempt to delete those SGs while the ALB lives fails DependencyViolation.
          for ARN in $(aws elbv2 describe-load-balancers --query 'LoadBalancers[].LoadBalancerArn' --output text); do
            V="$(aws elbv2 describe-tags --resource-arns "${ARN}" --query "TagDescriptions[0].Tags[?Key=='elbv2.k8s.aws/cluster'].Value" --output text)"
            [ "${V}" = "mockten-eks" ] && { echo "Deleting ALB ${ARN}"; aws elbv2 delete-load-balancer --load-balancer-arn "${ARN}" || true; }
          done
          echo "Dropping Kubernetes/Helm resources from state so Terraform teardown never touches the k8s API."
          terraform state list 2>/dev/null \
            | grep -E 'helm_release\.|kubernetes_|kubectl_manifest\.' \
            | while read -r addr; do echo "  state rm ${addr}"; terraform state rm "${addr}" || true; done
          # Also stop Terraform managing the frontend SG. It cannot be deleted until
          # both the ALB (above) and the LBC's k8s-traffic SG (which references it, and
          # only clears once the cluster/nodes are gone) are removed — an ordering
          # Terraform cannot see. The orphan-sweep step deletes it by VPC after the
          # cluster is destroyed.
          terraform state rm 'module.routing.aws_security_group.alb_frontend' 2>/dev/null || true

      # Two-pass teardown. A plain `terraform destroy` cannot finish on EKS the way
      # it does on GKE/AKS: there the cloud LB is a Service the cloud-controller
      # deletes with the cluster, but on AWS the Load Balancer Controller leaves an
      # ALB, target groups and a "k8s-traffic-*" security group in the VPC that
      # Terraform never owned, and a leftover SG blocks DeleteVpc with
      # "DependencyViolation". So destroy everything EXCEPT the VPC first, then sweep
      # those orphans, then destroy the VPC — which is now unblocked. (common_k8s and
      # the gp3 StorageClass were already dropped from state above, so they are not
      # targeted here.)
      - name: Terraform destroy — everything except the VPC
        working-directory: aws
        run: |
          TARGETS="-target=module.cdn -target=module.routing -target=module.platform -target=module.eks -target=module.dns"
          terraform destroy -auto-approve ${TARGETS}

      - name: Delete Load Balancer Controller orphans that block the VPC
        if: always()
        run: |
          CLUSTER_TAG="mockten-eks"
          VPC="$(aws ec2 describe-vpcs --filters Name=tag:Name,Values=mockten-vpc --query 'Vpcs[0].VpcId' --output text 2>/dev/null)"
          for ARN in $(aws elbv2 describe-load-balancers --query 'LoadBalancers[].LoadBalancerArn' --output text); do
            V="$(aws elbv2 describe-tags --resource-arns "${ARN}" --query "TagDescriptions[0].Tags[?Key=='elbv2.k8s.aws/cluster'].Value" --output text)"
            [ "${V}" = "${CLUSTER_TAG}" ] && { echo "Deleting orphaned ALB ${ARN}"; aws elbv2 delete-load-balancer --load-balancer-arn "${ARN}" || true; }
          done
          sleep 20
          for ARN in $(aws elbv2 describe-target-groups --query 'TargetGroups[].TargetGroupArn' --output text); do
            V="$(aws elbv2 describe-tags --resource-arns "${ARN}" --query "TagDescriptions[0].Tags[?Key=='elbv2.k8s.aws/cluster'].Value" --output text)"
            [ "${V}" = "${CLUSTER_TAG}" ] && aws elbv2 delete-target-group --target-group-arn "${ARN}" || true
          done
          if [ "${VPC}" != "None" ] && [ -n "${VPC}" ]; then
            for ENI in $(aws ec2 describe-network-interfaces --filters Name=vpc-id,Values=${VPC} Name=status,Values=available --query 'NetworkInterfaces[].NetworkInterfaceId' --output text); do
              echo "Deleting leftover ENI ${ENI}"; aws ec2 delete-network-interface --network-interface-id "${ENI}" || true
            done
            # Non-default SGs left in the VPC are all LBC orphans by this point (the
            # cluster/node SGs went with the cluster). Retry: they can reference each
            # other, so a first pass may leave one that a later pass can then delete.
            for _ in 1 2 3 4 5; do
              SGS="$(aws ec2 describe-security-groups --filters Name=vpc-id,Values=${VPC} --query "SecurityGroups[?GroupName!='default'].GroupId" --output text)"
              [ -z "${SGS}" ] && break
              for SG in ${SGS}; do echo "Deleting leftover SG ${SG}"; aws ec2 delete-security-group --group-id "${SG}" 2>/dev/null || true; done
              sleep 5
            done
          fi
          aws ec2 describe-volumes --filters Name=status,Values=available Name=tag-key,Values=kubernetes.io/created-for/pvc/name \
            --query 'Volumes[].VolumeId' --output text | tr '\t' '\n' \
            | while read -r VOL; do [ -n "${VOL}" ] && { echo "Deleting orphaned EBS volume ${VOL}"; aws ec2 delete-volume --volume-id "${VOL}" || true; }; done
          # A leftover mapped public address blocks the IGW from detaching.
          for ALLOC in $(aws ec2 describe-addresses --filters Name=tag:Name,Values=mockten-nat-eip --query 'Addresses[?AssociationId==null].AllocationId' --output text); do
            [ -n "${ALLOC}" ] && { echo "Releasing orphaned EIP ${ALLOC}"; aws ec2 release-address --allocation-id "${ALLOC}" || true; }
          done

      # if: always() — the orphan sweep above runs even when pass 1 errored, and this
      # pass MUST still run afterward or a pass-1 hiccup would leave the VPC + NAT
      # billing. For a full wipe it is a plain destroy, so it also retries anything
      # pass 1 did not finish; the k8s layer is already out of state, so it only ever
      # touches AWS infrastructure.
      - name: Terraform destroy — the VPC (and everything remaining)
        if: always()
        working-directory: aws
        run: |
          terraform destroy -auto-approve

      # A green destroy meant "Terraform finished", not "nothing is left" — if the
      # state was empty (e.g. a re-run) Terraform reports "0 destroyed" while real
      # resources could still be billing. Assert the billable ones are actually gone,
      # polling because EKS deletion is asynchronous, and fail loudly if any remain.
      - name: Verify teardown is complete
        if: always()
        run: |
          R="${TF_VAR_region}"
          LEFT="pending"
          for _ in $(seq 1 12); do
            LEFT=""
            C="$(aws eks list-clusters --region "$R" --query 'clusters' --output text 2>/dev/null)"
            [ -n "$C" ] && LEFT="${LEFT} eks:${C}"
            N="$(aws ec2 describe-nat-gateways --region "$R" --filter Name=state,Values=available,pending --query 'NatGateways[].NatGatewayId' --output text 2>/dev/null)"
            [ -n "$N" ] && LEFT="${LEFT} nat:${N}"
            I="$(aws ec2 describe-instances --region "$R" --filters Name=instance-state-name,Values=running,pending Name=tag-key,Values=aws:eks:cluster-name --query 'Reservations[].Instances[].InstanceId' --output text 2>/dev/null)"
            [ -n "$I" ] && LEFT="${LEFT} ec2:${I}"
            [ -z "${LEFT// /}" ] && break
            echo "Still present (async delete may be in progress):${LEFT} — waiting…"
            sleep 20
          done
          if [ -n "${LEFT// /}" ]; then
            echo "::error::Billable resources still present after teardown:${LEFT}"
            exit 1
          fi
          echo "Teardown verified — no EKS cluster, NAT gateway, or EKS-node instance remains."
