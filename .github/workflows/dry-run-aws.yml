name: DryRun(AWS)

# DRAFT — mirrors DryRun(GCP). The aws/ root is written but never applied, so this
# is scaffolding: it will need an AWS account, an S3 state bucket + DynamoDB lock,
# and the secrets below before it can pass. Manual (workflow_dispatch) so it never
# fails on every push for clones without AWS configured.
#
# Required repository secrets (draft names):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  deploy IAM user (or use OIDC role)
#   AWS_REGION                                 e.g. us-east-1
#   AWS_TFSTATE_BUCKET                          S3 bucket holding terraform state
#   plus the same app secrets as GCP (GH_*, ROOT_DOMAIN, LETSENCRYPT_EMAIL,
#   ALLOWLIST_CIDR, DOMAIN_API_KEY, STRIPE_*, CLOUD_GOOGLE_*/GOOGLE_*, FACEBOOK_*)

on:
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      TF_VAR_region: ${{ secrets.AWS_REGION }}
      TF_VAR_github_username: ${{ secrets.GH_USERNAME }}
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
      TF_VAR_github_email: ${{ secrets.GH_EMAIL }}
      TF_VAR_google_client_id: ${{ secrets.CLOUD_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.CLOUD_GOOGLE_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_facebook_client_id: ${{ secrets.CLOUD_FACEBOOK_CLIENT_ID || secrets.FACEBOOK_CLIENT_ID }}
      TF_VAR_facebook_client_secret: ${{ secrets.CLOUD_FACEBOOK_CLIENT_SECRET || secrets.FACEBOOK_CLIENT_SECRET }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_public_key: ${{ secrets.STRIPE_PUBLIC_KEY }}
      TF_VAR_domain_api_key: ${{ secrets.DOMAIN_API_KEY }}
      TF_VAR_allowlist_cidr: ${{ secrets.ALLOWLIST_CIDR }}
      TF_VAR_root_domain: ${{ secrets.ROOT_DOMAIN }}
      TF_VAR_letsencrypt_email: ${{ secrets.LETSENCRYPT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform init
        working-directory: aws
        run: terraform init -backend-config="bucket=${{ secrets.AWS_TFSTATE_BUCKET }}"

      - name: Terraform validate
        working-directory: aws
        run: terraform validate

      # -refresh=false: the EKS control plane is IP-restricted like GKE, so a CI
      # runner cannot reach the kubernetes/helm providers to refresh live state.
      # This catches config/plan errors without cluster connectivity.
      - name: Terraform plan
        working-directory: aws
        run: terraform plan -input=false -refresh=false
