name: AWS 2.Deploy

# Manual, like Deploy(GCP/Azure). Brings the mockten platform up on EKS from an
# empty account (S3 state bucket + DynamoDB lock are one-time prerequisites, see
# aws/README.md). `terraform apply` is idempotent: if a run fails partway, run it
# again — already-created resources are skipped and it continues.
#
# AWS is cloud-native: ALB (AWS Load Balancer Controller) + ACM + CloudFront/WAF,
# not ingress-nginx/cert-manager. So there is no LETSENCRYPT_EMAIL / acme_staging.
# Required repository secrets: see dry-run-aws.yml's header.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TF_VAR_region: ${{ secrets.AWS_REGION }}
      TF_VAR_github_username: ${{ secrets.GH_USERNAME }}
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
      TF_VAR_github_email: ${{ secrets.GH_EMAIL }}
      TF_VAR_google_client_id: ${{ secrets.CLOUD_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.CLOUD_GOOGLE_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_facebook_client_id: ${{ secrets.CLOUD_FACEBOOK_CLIENT_ID || secrets.FACEBOOK_CLIENT_ID }}
      TF_VAR_facebook_client_secret: ${{ secrets.CLOUD_FACEBOOK_CLIENT_SECRET || secrets.FACEBOOK_CLIENT_SECRET }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_public_key: ${{ secrets.STRIPE_PUBLIC_KEY }}
      TF_VAR_domain_api_key: ${{ secrets.DOMAIN_API_KEY }}
      TF_VAR_allowlist_cidr: ${{ secrets.ALLOWLIST_CIDR }}
      TF_VAR_root_domain: ${{ secrets.ROOT_DOMAIN }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      # The EKS API server admits only ALLOWLIST_CIDR, and the runner's egress IP is
      # dynamic. Passing it as the TF var is enough for a FRESH apply (the cluster is
      # created with the runner already authorized). On a RE-apply the cluster exists,
      # so Terraform must refresh in-cluster resources before it can apply the
      # publicAccessCidrs change — and the runner isn't authorized yet, so that
      # refresh times out. Open the hole LIVE with `aws eks update-cluster-config`
      # first when the cluster exists, and pass the same value as the var.
      - name: Authorize this runner on the EKS API server
        run: |
          RUNNER_IP="$(curl -s https://api.ipify.org)/32"
          echo "TF_VAR_master_authorized_extra=[\"${RUNNER_IP}\"]" >> "$GITHUB_ENV"
          CLUSTER="$(aws eks list-clusters --query 'clusters[0]' --output text 2>/dev/null)"
          if [ "${CLUSTER}" != "None" ] && [ -n "${CLUSTER}" ]; then
            NETS="$(echo "${TF_VAR_allowlist_cidr},${RUNNER_IP}" | tr -d '[:space:]')"
            echo "Existing cluster ${CLUSTER} — authorizing this runner live before Terraform refresh."
            aws eks update-cluster-config --name "${CLUSTER}" \
              --resources-vpc-config "endpointPublicAccess=true,publicAccessCidrs=${NETS}" || true
            echo "Waiting for the control-plane config update to finish..."
            for _ in $(seq 1 30); do
              S="$(aws eks describe-cluster --name "${CLUSTER}" --query 'cluster.status' --output text)"
              [ "${S}" = "ACTIVE" ] && break
              sleep 20
            done
          else
            echo "No cluster yet — the fresh apply creates it with this runner authorized."
          fi

      - name: Terraform init
        working-directory: aws
        run: terraform init -backend-config="bucket=${{ secrets.AWS_TFSTATE_BUCKET }}"

      - name: Terraform apply
        working-directory: aws
        run: terraform apply -auto-approve

      # Verify READY from the cluster, NOT by curling the public URLs: the WAF only
      # admits ALLOWLIST_CIDR (plus the cluster NAT), and this runner's IP is on
      # neither list — a public curl from CI would (correctly) get a 403. The runner
      # IS authorized on the EKS API, so check the workloads + the trained model with
      # kubectl instead. ACM/ALB/CloudFront already came up synchronously during apply.
      - name: Verify environment is READY
        if: always()
        working-directory: aws
        run: |
          CLUSTER="$(aws eks list-clusters --query 'clusters[0]' --output text)"
          [ "${CLUSTER}" = "None" ] && { echo "No cluster."; exit 0; }
          aws eks update-kubeconfig --name "${CLUSTER}" --region "${TF_VAR_region}"
          echo "Waiting for workloads to be Ready..."
          kubectl -n default wait --for=condition=Ready pods --all --timeout=420s || true
          # The behavior-seeder Job (common/k8s/seeder — identical on every cloud)
          # seeds the orders and triggers training; it waits for the recommendation
          # service to be Ready first, so the model trains on its own. Just report.
          echo "Reading the recommendation model status..."
          TRAINED="unknown"
          for _ in $(seq 1 40); do
            TRAINED="$(kubectl -n default exec deploy/meilisearch-deploy -- \
              curl -s -m 5 http://recommendation-service.default.svc.cluster.local:8080/model/status 2>/dev/null \
              | grep -o '"is_trained":[a-z]*' || true)"
            echo "  model: ${TRAINED:-pending}"
            echo "${TRAINED}" | grep -q 'true' && break
            sleep 15
          done
          {
            echo "### Deployed to EKS (cloud-native: ALB + ACM + CloudFront/WAF)"
            echo "- CloudFront: $(terraform output -raw cdn_domain 2>/dev/null || echo n/a)"
            echo "- Recommendation model: ${TRAINED:-unknown}"
            echo '```'
            kubectl -n default get pods 2>&1 | tail -40
            echo '```'
            echo "_Public surfaces are served through CloudFront and gated by the WAF to ALLOWLIST_CIDR; verify them from an allowlisted network, not from CI._"
          } >> "$GITHUB_STEP_SUMMARY"
