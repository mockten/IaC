name: Azure 3.Destroy

# Tears the whole Azure environment down, to GCP 3.Destroy parity. Manual only (the
# old 4x/day cron is gone) and demands the subscription id be typed in, so a destroy
# is never one mis-click from an apply. Works from ANY state — including a half-
# destroyed one — and cleans up billing resources Terraform does not track (the AKS
# node resource group's managed disks), so nothing keeps costing after it runs.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the Azure subscription id to confirm destruction"
        required: true
        type: string

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      # Terraform needs the full variable set to build a plan even when it only destroys.
      TF_VAR_github_username: ${{ secrets.GH_USERNAME }}
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
      TF_VAR_github_email: ${{ secrets.GH_EMAIL }}
      TF_VAR_google_client_id: ${{ secrets.CLOUD_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.CLOUD_GOOGLE_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_facebook_client_id: ${{ secrets.CLOUD_FACEBOOK_CLIENT_ID || secrets.FACEBOOK_CLIENT_ID }}
      TF_VAR_facebook_client_secret: ${{ secrets.CLOUD_FACEBOOK_CLIENT_SECRET || secrets.FACEBOOK_CLIENT_SECRET }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_public_key: ${{ secrets.STRIPE_PUBLIC_KEY }}
      TF_VAR_domain_api_key: ${{ secrets.DOMAIN_API_KEY }}
      TF_VAR_allowlist_cidr: ${{ secrets.ALLOWLIST_CIDR }}
      TF_VAR_root_domain: ${{ secrets.ROOT_DOMAIN }}
      TF_VAR_letsencrypt_email: ${{ secrets.LETSENCRYPT_EMAIL }}

    steps:
      - name: Check the typed confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "${ARM_SUBSCRIPTION_ID}" ]; then
            echo "::error::Confirmation does not match the subscription id. Nothing was destroyed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # No wrapper: the teardown deliberately `|| true`s benign failures (e.g.
          # `terraform state rm` of an address already gone), but the wrapper would
          # still surface each as a red "Terraform exited with code 1" annotation.
          # Real failures still fail the step via its own exit code.
          terraform_wrapper: false
          terraform_version: 1.9.5

      - name: Azure CLI login
        run: az login --service-principal -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" --tenant "$ARM_TENANT_ID" -o none

      - name: Terraform init
        working-directory: azure
        run: terraform init

      # Delete the AKS cluster up front, synchronously, so `terraform destroy` never
      # trips over it. Two problems this avoids:
      #   1. The nodes subnet can't be deleted while the AKS node VMSS still lives in
      #      it, and only deleting the cluster removes that VMSS (and its MC_* node
      #      resource group). Terraform's own cluster delete can RETURN before Azure
      #      finishes tearing the MC_* RG down, so Terraform then races ahead to the
      #      subnet and fails: "InUseSubnetCannotBeDeleted". Deleting the cluster here
      #      and WAITING for the node RG to vanish leaves the subnet free.
      #   2. The cluster's in-cluster Kubernetes/Helm objects die with it; refreshing
      #      them against a gone API server would only time out. Drop them — and the
      #      cluster + its AGIC role assignments — from state so Terraform destroys only
      #      the remaining Azure infrastructure. `az aks delete` is a management-plane
      #      call, so no API-server IP authorization is needed.
      - name: Delete the AKS cluster up front and drop Kubernetes from state
        working-directory: azure
        run: |
          CLUSTER="$(az aks list --query '[0].name' -o tsv 2>/dev/null)"
          RG="$(az aks list --query '[0].resourceGroup' -o tsv 2>/dev/null)"
          if [ -n "${CLUSTER}" ]; then
            NODE_RG="$(az aks show -g "${RG}" -n "${CLUSTER}" --query nodeResourceGroup -o tsv 2>/dev/null)"
            echo "Deleting AKS cluster ${CLUSTER} synchronously (frees the nodes subnet)."
            az aks delete -g "${RG}" -n "${CLUSTER}" --yes
            if [ -n "${NODE_RG}" ]; then
              echo "Waiting for node resource group ${NODE_RG} to disappear..."
              for _ in $(seq 1 60); do
                az group show -n "${NODE_RG}" >/dev/null 2>&1 || { echo "  gone."; break; }
                sleep 10
              done
            fi
          else
            echo "No AKS cluster present."
          fi
          # The cluster may already be gone from a prior partial destroy while its MC_*
          # node RG (and the VMSS in the subnet) was orphaned — which is exactly what
          # still blocks the subnet. Delete any leftover MC_* RG SYNCHRONOUSLY (no
          # --no-wait) here, so the subnet is guaranteed free before Terraform runs.
          az group list --query "[?starts_with(name,'MC_mockten')].name" -o tsv \
            | while read -r NRG; do
                [ -z "${NRG}" ] && continue
                echo "Deleting leftover node resource group ${NRG} synchronously."
                az group delete --name "${NRG}" --yes || true
              done
          echo "Dropping the cluster, its AGIC role assignments, and Kubernetes/Helm from state."
          terraform state list 2>/dev/null \
            | grep -E 'module\.aks\.|azurerm_role_assignment\.agic_|helm_release\.|kubernetes_|kubectl_manifest\.' \
            | while read -r addr; do echo "  state rm ${addr}"; terraform state rm "${addr}" || true; done

      - name: Terraform destroy
        working-directory: azure
        run: |
          terraform destroy -auto-approve

      # Belt-and-suspenders billing cleanup. Deleting the AKS cluster normally
      # cascades its managed node resource group (MC_*) and the dynamically-provisioned
      # PVC disks in it, but a partial destroy can leave them — and they keep billing.
      # The tfstate storage account lives in mockten-tfstate-rg, which never matches
      # these patterns, so it is preserved.
      - name: Delete leftover node resource groups and orphaned disks
        if: always()
        run: |
          az group list --query "[?starts_with(name,'MC_mockten')].name" -o tsv \
            | while read -r RG; do
                [ -z "${RG}" ] && continue
                echo "Deleting leftover node resource group ${RG}"
                az group delete --name "${RG}" --yes --no-wait || true
              done
          az disk list --query "[?diskState=='Unattached' && starts_with(name,'pvc-')].id" -o tsv \
            | while read -r ID; do
                [ -z "${ID}" ] && continue
                echo "Deleting orphaned disk ${ID}"
                az disk delete --ids "${ID}" --yes || true
              done

      # A green destroy meant "Terraform finished", not "nothing is left" — if the
      # state was empty (e.g. a re-run) Terraform reports "0 destroyed" while real
      # resources could still be billing. Assert the billable ones are actually gone,
      # polling because AKS deletion is asynchronous, and fail loudly if any remain.
      - name: Verify teardown is complete
        if: always()
        run: |
          LEFT="pending"
          for _ in $(seq 1 12); do
            LEFT=""
            K="$(az aks list --query '[].name' -o tsv 2>/dev/null | tr '\n' ' ')"
            [ -n "${K// /}" ] && LEFT="${LEFT} aks:${K}"
            G="$(az network application-gateway list --query '[].name' -o tsv 2>/dev/null | tr '\n' ' ')"
            [ -n "${G// /}" ] && LEFT="${LEFT} appgw:${G}"
            P="$(az network public-ip list --query '[].name' -o tsv 2>/dev/null | tr '\n' ' ')"
            [ -n "${P// /}" ] && LEFT="${LEFT} pip:${P}"
            [ -z "${LEFT// /}" ] && break
            echo "Still present (async delete may be in progress):${LEFT} — waiting…"
            sleep 20
          done
          if [ -n "${LEFT// /}" ]; then
            echo "::error::Billable resources still present after teardown:${LEFT}"
            exit 1
          fi
          echo "Teardown verified — no AKS cluster, App Gateway, or public IP remains."
