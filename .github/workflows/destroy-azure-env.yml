name: Azure 3.Destroy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
    - cron: '0 4 * * *'
    - cron: '0 8 * * *'
jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      # Terraform reads TF_VAR_<name> natively, so no tfvars file is written to
      # the runner's disk and no secret goes through shell quoting.
      # `azure` only declares repo_pat; the github_* vars live in `local`.
      TF_VAR_repo_pat: ${{ secrets.MOCKTEN_REPO_PAT }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.9.5

    - name: Initialize Terraform for Azure
      working-directory: azure
      run: terraform init

    - name: Terraform Destroy for Azure
      working-directory: azure
      run: terraform destroy -auto-approve
