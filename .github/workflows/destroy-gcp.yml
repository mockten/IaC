name: GCP 3.Destroy

# Tears the whole GCP environment down. Separate from Deploy(GCP) on purpose:
# a destroy sitting in a dropdown next to "apply" is one mis-click from deleting
# the environment, and this one additionally demands the project id be typed in.
#
# Required repository secrets: the same set Deploy(GCP) uses. Terraform needs the
# full variable set to build the plan even when the plan only destroys.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the GCP project id to confirm destruction"
        required: true
        type: string
      keep_dns_zone:
        description: "Keep the Cloud DNS zone (avoids re-delegating nameservers at the registrar on the next apply)"
        type: boolean
        default: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      TF_VAR_project: ${{ secrets.GCP_PROJECT }}
      TF_VAR_github_username: ${{ secrets.GH_USERNAME }}
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
      TF_VAR_github_email: ${{ secrets.GH_EMAIL }}
      TF_VAR_google_client_id: ${{ secrets.CLOUD_GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.CLOUD_GOOGLE_CLIENT_SECRET || secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_facebook_client_id: ${{ secrets.CLOUD_FACEBOOK_CLIENT_ID || secrets.FACEBOOK_CLIENT_ID }}
      TF_VAR_facebook_client_secret: ${{ secrets.CLOUD_FACEBOOK_CLIENT_SECRET || secrets.FACEBOOK_CLIENT_SECRET }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_public_key: ${{ secrets.STRIPE_PUBLIC_KEY }}
      TF_VAR_domain_api_key: ${{ secrets.DOMAIN_API_KEY }}
      TF_VAR_allowlist_cidr: ${{ secrets.ALLOWLIST_CIDR }}
      TF_VAR_root_domain: ${{ secrets.ROOT_DOMAIN }}

    steps:
      - name: Check the typed confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "${GCP_PROJECT}" ]; then
            echo "::error::Confirmation does not match the project id. Nothing was destroyed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform init
        working-directory: gcp
        run: terraform init -backend-config="bucket=${GCP_PROJECT}-tfstate"

      # Make destroy work from ANY state, including a half-destroyed one.
      #
      # Terraform's kubernetes/helm providers talk to the cluster's API server,
      # which only admits allowlisted CIDRs, and the runner's egress IP is dynamic.
      # Two cases have to be handled or `terraform destroy` hangs on a "dial tcp
      # <api-ip>:443: i/o timeout":
      #
      #   1. Cluster still up  → authorize this runner LIVE with gcloud (setting the
      #      TF var alone is not enough on destroy — Terraform never applies that
      #      update, it only reads and deletes).
      #   2. Cluster already gone but its k8s objects still sit in state (a previous
      #      destroy that stopped partway) → those objects died with the cluster, so
      #      drop them from state; otherwise Terraform tries to refresh them against
      #      an API endpoint that no longer exists and times out.
      # The GKE (gce) Ingress creates the external Application LB out-of-band — global
      # forwarding rules, target proxies, url maps, backend services, health checks,
      # NEGs, an mcrt-* SSL cert and l7 firewall rules. Deleting the Ingress OBJECT is
      # what makes the GKE controller tear all of that down cleanly; if Terraform just
      # deletes the cluster/VPC first, those LB resources orphan and (like the AWS LBC
      # orphans) keep billing and block the network delete. So when the cluster is up:
      # authorize the runner, delete the Ingresses via kubectl, and WAIT for the LB
      # resources to drain. Then (either case) drop the Kubernetes layer from state so
      # Terraform destroys only GCP infrastructure.
      - name: Authorize runner, delete Ingresses so GKE drains the LB, drop k8s state
        working-directory: gcp
        run: |
          RUNNER_IP="$(curl -s https://api.ipify.org)/32"
          echo "TF_VAR_master_authorized_extra=[\"${RUNNER_IP}\"]" >> "$GITHUB_ENV"
          CLUSTER="$(gcloud container clusters list --project "${GCP_PROJECT}" --format='value(name)' | head -1)"
          if [ -n "${CLUSTER}" ]; then
            echo "Cluster ${CLUSTER} is up — authorizing this runner on the control plane."
            NETS="$(echo "${TF_VAR_allowlist_cidr},${RUNNER_IP}" | tr -d '[:space:]')"
            gcloud container clusters update "${CLUSTER}" \
              --zone us-east1-b --project "${GCP_PROJECT}" \
              --enable-master-authorized-networks \
              --master-authorized-networks "${NETS}"
            gcloud container clusters get-credentials "${CLUSTER}" \
              --zone us-east1-b --project "${GCP_PROJECT}"
            echo "Deleting Ingresses so the GKE controller tears down the Application LB."
            kubectl -n default delete ingress --all --ignore-not-found --timeout=120s || true
            echo "Waiting for GKE-managed forwarding rules to drain..."
            for _ in $(seq 1 30); do
              LEFT=$(gcloud compute forwarding-rules list --project "${GCP_PROJECT}" \
                --filter="name~'^k8s'" --format="value(name)" | wc -l | tr -d ' ')
              echo "  k8s forwarding-rules remaining: ${LEFT}"
              [ "${LEFT}" = "0" ] && break
              sleep 10
            done
          else
            echo "No cluster found — skipping live LB drain."
          fi
          echo "Dropping Kubernetes resources from state (they die with the cluster)."
          terraform state list 2>/dev/null \
            | grep -E 'kubernetes_|kubectl_manifest\.|helm_release\.' \
            | while read -r addr; do
                echo "  state rm ${addr}"
                terraform state rm "${addr}" || true
              done

      # A destroy that fails at plan time has historically been the failure mode
      # here (an unknown value reaching a `count` breaks destroy as well as
      # apply). Surface that before anything is deleted.
      - name: Terraform plan -destroy
        working-directory: gcp
        run: terraform plan -destroy -no-color

      - name: Terraform destroy
        working-directory: gcp
        run: |
          if [ "${{ inputs.keep_dns_zone }}" = "true" ]; then
            # Everything except the zone and its records. Recreating the zone
            # hands out new nameservers, which must then be re-pushed to the
            # registrar and propagated before certificates can be issued again.
            terraform destroy -auto-approve \
              -target=module.common_k8s \
              -target=module.platform \
              -target=module.gke \
              -target=module.nw \
              -target=google_compute_global_address.ingress
          else
            terraform destroy -auto-approve
          fi

      # StatefulSet volumeClaimTemplate PVCs are owned by nothing Terraform tracks:
      # the CSI driver provisions the backing PD dynamically, and the PVC retention
      # policy is Retain (so data survives an app-layer redeploy). A full teardown
      # therefore leaves those pvc-* disks orphaned and still billing. Delete the
      # unattached ones so a destroy is actually clean. `if: always()` so it also
      # cleans up after a partial destroy.
      # Belt-and-suspenders for the GKE Ingress LB: if the controller did not finish
      # draining before the cluster went away, its resources orphan and keep billing.
      # Delete them in dependency order (a backend service can't go while a proxy/url
      # map still points at it, etc.). All are named k8s*/mcrt* by GKE, so the apex
      # storefront's own Terraform resources are never matched. The Cloud Armor policy
      # is Terraform-owned and removed by the destroy once no backend references it.
      - name: Delete orphaned GKE load-balancer resources
        if: always()
        run: |
          P="${GCP_PROJECT}"
          sweep() { # $1=resource group, rest=extra flags
            local kind="$1"; shift
            gcloud compute "${kind}" list --project "$P" --filter="name~'^(k8s|mcrt)'" \
              --format="value(name)" 2>/dev/null | while read -r N; do
                [ -z "$N" ] && continue
                echo "  deleting ${kind} ${N}"
                gcloud compute "${kind}" delete "$N" --project "$P" --global --quiet "$@" 2>/dev/null || true
              done
          }
          echo "forwarding-rules";        sweep forwarding-rules
          echo "target-https-proxies";    sweep target-https-proxies
          echo "target-http-proxies";     sweep target-http-proxies
          echo "url-maps";                sweep url-maps
          echo "backend-services";        sweep backend-services
          echo "health-checks";           sweep health-checks
          echo "ssl-certificates";        sweep ssl-certificates
          echo "firewall-rules"
          gcloud compute firewall-rules list --project "$P" --filter="name~'^k8s'" \
            --format="value(name)" 2>/dev/null | while read -r N; do
              [ -z "$N" ] && continue; echo "  deleting firewall-rule ${N}"
              gcloud compute firewall-rules delete "$N" --project "$P" --quiet 2>/dev/null || true
            done
          echo "network-endpoint-groups (zonal)"
          gcloud compute network-endpoint-groups list --project "$P" --filter="name~'^k8s'" \
            --format="value(name,zone.basename())" 2>/dev/null | while read -r N Z; do
              [ -z "$N" ] && continue; echo "  deleting NEG ${N} (${Z})"
              gcloud compute network-endpoint-groups delete "$N" --zone "$Z" --project "$P" --quiet 2>/dev/null || true
            done

      - name: Delete orphaned PVC disks
        if: always()
        run: |
          DISKS=$(gcloud compute disks list --project "${GCP_PROJECT}" \
            --filter="name~'^pvc-' AND -users:*" \
            --format="value(name,zone.basename())")
          if [ -z "${DISKS}" ]; then
            echo "No orphaned PVC disks left behind."
          else
            echo "${DISKS}" | while read -r NAME ZONE; do
              [ -z "${NAME}" ] && continue
              echo "Deleting orphaned disk ${NAME} (${ZONE})"
              gcloud compute disks delete "${NAME}" --zone "${ZONE}" \
                --project "${GCP_PROJECT}" --quiet || true
            done
          fi
