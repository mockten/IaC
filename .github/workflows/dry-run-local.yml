name: Minikube DryRun

on:
  push:
    branches:
      - '**'

jobs:
  dry-run:
    runs-on: ubuntu-latest
    # Terraform reads TF_VAR_<name> natively, so no tfvars file is written to
    # the runner's disk and no secret goes through shell quoting. These are the
    # same variables .env supplies locally — only the source differs.
    env:
      # local/main.tf pins the kube context to docker-desktop by default; the
      # runner has no such context — point the plan at the minikube it starts.
      TF_VAR_kube_context: minikube
      TF_VAR_github_username: ${{ secrets.GH_USERNAME }}
      TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
      TF_VAR_github_email: ${{ secrets.GH_EMAIL }}
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_facebook_client_id: ${{ secrets.FACEBOOK_CLIENT_ID }}
      TF_VAR_facebook_client_secret: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_public_key: ${{ secrets.STRIPE_PUBLIC_KEY }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.9.5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y apt-transport-https ca-certificates curl

    - name: Install Docker
      run: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y docker-ce docker-ce-cli containerd.io

    - name: Install Minikube
      run: |
        curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        sudo install minikube-linux-amd64 /usr/local/bin/minikube

    - name: Start Minikube
      run: |
        minikube start --driver=docker

    - name: Initialize Terraform for local
      working-directory: local
      run: terraform init

    - name: Terraform Plan for local
      working-directory: local
      run: terraform plan
